<script>

};
const GAME_ID = "madi29"; // change to start a totally fresh game

// The 10 rounds. Edit freely. type: "text" or "song". oneWord forces a single word.
const ROUNDS = [
  { prompt: "Describe Madi in one word", type: "text", oneWord: true, max: 24 },
  { prompt: "Pick a song that describes Madi", type: "song" },
  { prompt: "Write the newspaper headline for Madi's 29th", type: "text", max: 90 },
  { prompt: "Your favorite Madi memory, in one sentence", type: "text", max: 160 },
  { prompt: "The song that should play when Madi walks into a room", type: "song" },
  { prompt: "If Madi were a brunch item, what would she be?", type: "text", max: 60 },
  { prompt: "What's Madi's secret superpower?", type: "text", max: 90 },
  { prompt: "What will Madi be doing at 39?", type: "text", max: 120 },
  { prompt: "The ultimate Madi road trip song", type: "song" },
  { prompt: "Final round: a one-sentence birthday toast to Madi", type: "text", max: 160 }
];

const WIN_MOVE = 5;   // Madi's favorite moves this many spaces
const PLAY_MOVE = 2;  // everyone else who answered
const FINISH = 29;    // cross space 29 (the crown) to win

// Special spaces: index -> { icon, label, move }
const SPECIALS = {
  3:  { icon: "🥂", label: "Mimosa refill", move: 1 },
  6:  { icon: "⏳", label: "Waiting for a table", move: -1 },
  9:  { icon: "⚽", label: "Timbers goal!", move: 2 },
  12: { icon: "🧇", label: "Bottomless waffles", move: 1 },
  15: { icon: "🌺", label: "Honolulu getaway", move: 3 },
  18: { icon: "💸", label: "You got the brunch bill", move: -3 },
  21: { icon: "📸", label: "Selfie with Madi", move: 1 },
  24: { icon: "🍳", label: "Dropped your eggs", move: -1 },
  26: { icon: "🎂", label: "Extra cake slice", move: 2 }
};
</script>
<style>

  --cream:#fff6e6; --ink:#2a1f3d; --red:#ef4f4f; --yellow:#ffc83d; --teal:#1fb5a8;
  --purple:#8a5cf6; --pink:#ff7ab6; --blue:#3d8bff; --green:#3ec46d; --line:#2a1f3d;
}

html,body{margin:0;background:var(--cream);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{padding:12px 12px 120px;max-width:560px;margin:0 auto}
h1,h2,h3,.display{font-family:"Lilita One",system-ui,sans-serif;font-weight:400;letter-spacing:.5px;margin:0}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
header h1{font-size:30px;line-height:1}
header h1 span{color:var(--red)}
.pill{font-weight:800;font-size:12px;border:2px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff}
.card{background:#fff;border:3px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--line);padding:16px;margin:14px 0}
.btn{display:block;width:100%;font-family:"Lilita One";font-size:20px;letter-spacing:.5px;border:3px solid var(--line);border-radius:14px;
  padding:12px 14px;background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 var(--line);cursor:pointer;margin-top:10px}

input:focus{outline:none;border-color:var(--purple)}
.muted{opacity:.65;font-size:14px}
.center{text-align:center}
/* ---------- board ---------- */
.board{position:relative;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(8,1fr);gap:3px;
  aspect-ratio:9/8;background:var(--line);border:3px solid var(--line);border-radius:16px;padding:3px;box-shadow:0 5px 0 var(--line)}
.tile{background:#fff;border-radius:6px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  overflow:hidden;min-width:0}
.tile .n{font-size:8px;font-weight:900;opacity:.4;margin-top:1px;line-height:1}
.tile .ic{font-size:13px;line-height:1.1}
.tile.sp-good{background:#e6fbef}.tile.sp-bad{background:#ffe9e9}
.tile.start{background:var(--yellow)}.tile.crown{background:linear-gradient(135deg,#ffe27a,#ffb627)}
.tile.start .ic,.tile.crown .ic{font-size:15px}
.tile .lab{font-size:7px;font-weight:900;line-height:1}
.tokens{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;padding:1px;position:absolute;bottom:1px;left:0;right:0}
.tok{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);font-size:8px;font-weight:900;color:#fff;
  display:flex;align-items:center;justify-content:center;line-height:1;text-transform:uppercase}

.mid{grid-column:2/9;grid-row:2/8;background:var(--cream);border-radius:10px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:8px;gap:4px}
.mid .logo{font-family:"Lilita One";font-size:clamp(26px,9vw,44px);line-height:.95;color:var(--red);text-shadow:3px 3px 0 var(--ink)}

.mid .rnd{font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.mid .prompt{font-family:"Lilita One";font-size:clamp(14px,4.4vw,20px);line-height:1.1}
/* ---------- legend ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;background:#fff;font-weight:800;font-size:13px}

.chip.done{opacity:.5}
/* ---------- answers ---------- */
.ans{border:3px solid var(--line);border-radius:14px;padding:12px;margin:10px 0;background:#fff;cursor:default;position:relative}

.song .a{font-size:13px;font-weight:700;opacity:.7}

.results .ans{cursor:pointer}
.events{font-weight:800;font-size:14px;line-height:1.6}

.confetti{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;animation:fall linear forwards}

.big{font-size:44px}
.banner{background:var(--teal);color:#fff;border:3px solid var(--line);border-radius:12px;padding:8px 12px;font-weight:900;font-size:13px;margin-bottom:8px}
</style>

<body>
<header>
  <h1>Madi's <span>29th</span></h1>
  <div class="pill" id="who">Not joined</div>
</header>
<div id="modeBanner"></div>
<div class="board" id="board"></div>
<div class="legend" id="legend"></div>
<div id="main"></div>
<div id="host"></div>
<div class="confetti" id="confetti"></div>

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS = ["#ef4f4f","#3d8bff","#1fb5a8","#8a5cf6","#ff7ab6","#f08a24","#3ec46d","#d4a017","#6b4f3a","#2a9df4","#c2185b","#5d6d7e"];
const params = new URLSearchParams(location.search);
const IS_HOST = params.has("host");
const LOCAL = !FIREBASE_CONFIG.apiKey;
function lsGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function lsSet(k,v){ try{localStorage.setItem(k,v)}catch(e){} }
// In local test mode each tab is its own player (sessionStorage); live, your phone remembers you.
const idStore = { get(k){ try{return (LOCAL?sessionStorage:localStorage).getItem(k)}catch(e){return null} },
                  set(k,v){ try{(LOCAL?sessionStorage:localStorage).setItem(k,v)}catch(e){} } };
let ME = idStore.get("m29-id-"+GAME_ID);
if(!ME){ ME = "p" + Math.random().toString(36).slice(2,10); idStore.set("m29-id-"+GAME_ID, ME); }
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function setIn(obj, path, val){
  const ks = path.split("/"); let o = obj;
  for(let i=0;i<ks.length-1;i++){ if(typeof o[ks[i]]!=="object"||o[ks[i]]===null) o[ks[i]]={}; o=o[ks[i]]; }
  if(val===null||val===undefined) delete o[ks.at(-1)]; else o[ks.at(-1)] = val;
}

/* ================= storage adapter ================= */
let store;
function makeLocalStore(cb){
  const KEY = "m29-local-"+GAME_ID;
  const read = () => { try{return JSON.parse(lsGet(KEY)||"{}")}catch(e){return{}} };
  const write = o => { lsSet(KEY, JSON.stringify(o)); cb(o); };
  window.addEventListener("storage", e => { if(e.key===KEY) cb(read()); });
  setTimeout(()=>cb(read()),0);
  return {
    update(map){ const o=read(); for(const p in map) setIn(o,p,map[p]); write(o); },
    set(path,val){ this.update({[path]:val}); }
  };
}
function makeFirebaseStore(cb){
  firebase.initializeApp(FIREBASE_CONFIG);
  const ref = firebase.database().ref("games/"+GAME_ID);
  ref.on("value", snap => cb(snap.val()||{}));
  return {
    update(map){ return ref.update(map); },
    set(path,val){ return ref.child(path).set(val); }
  };
}
function loadScript(src){ return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);}); }

/* ================= state ================= */
let S = {};
let ui = { selected:null, songResults:null, searching:false, editing:false, manualSong:false };
const meta = () => S.meta || { phase:"lobby", round:0 };
const players = () => S.players || {};
const judgeId = () => meta().judge || null;
const racers = () => Object.entries(players()).filter(([id])=>id!==judgeId()).sort((a,b)=>(a[1].joined||0)-(b[1].joined||0));
const colorOf = id => { const all = Object.entries(players()).sort((a,b)=>(a[1].joined||0)-(b[1].joined||0)).map(x=>x[0]); return COLORS[Math.max(0,all.indexOf(id))%COLORS.length]; };
const nameOf = id => players()[id]?.name || "Someone";
const answersFor = r => (S.answers && S.answers["r"+r]) || {};

/* Board movement is derived from answers + picks, so it can never drift. */
function computeBoard(){
  const pos = {}, wins = {}, crossedAt = {}, events = {};
  racers().forEach(([id])=>{ pos[id]=0; wins[id]=0; });
  for(let r=0;r<ROUNDS.length;r++){
    const pick = S.picks && S.picks["r"+r];
    if(!pick) continue;
    const ev = events[r] = [];
    for(const id of Object.keys(answersFor(r))){
      if(!(id in pos) || crossedAt[id]!==undefined) continue;
      const step = id===pick ? WIN_MOVE : PLAY_MOVE;
      if(id===pick) wins[id]++;
      let p = pos[id] + step;
      const sp = SPECIALS[p];
      if(sp && p < FINISH){ p = Math.max(0, p + sp.move); ev.push({id, sp}); }
      pos[id] = p;
      if(p >= FINISH && crossedAt[id]===undefined) crossedAt[id] = r;
    }
  }
  return { pos, wins, crossedAt, events };
}
function standings(B){
  return racers().map(([id])=>id).sort((a,b)=>{
    const ca = B.crossedAt[a] ?? 99, cb = B.crossedAt[b] ?? 99;
    if(ca!==cb) return ca-cb;
    if(B.pos[b]!==B.pos[a]) return B.pos[b]-B.pos[a];
    return B.wins[b]-B.wins[a];
  });
}

/* ================= board render + animation ================= */
function tileCoord(i){ // 9 cols x 8 rows perimeter, 30 tiles, Start bottom-left, clockwise to the right
  if(i<=8) return [i+1, 8];
  if(i<=15) return [9, 8-(i-8)];
  if(i<=23) return [9-(i-15), 1];
  return [1, 1+(i-23)];
}
let shown = {};   // displayed positions (animated)
let animTimer = null;
function buildBoard(){
  let h = "";
  for(let i=0;i<=FINISH;i++){
    const [c,r] = tileCoord(i), sp = SPECIALS[i];
    let cls = "tile", ic = "", lab = "";
    if(i===0){ cls+=" start"; ic="🏁"; lab="START"; }
    else if(i===FINISH){ cls+=" crown"; ic="👑"; lab="CROWN"; }
    else if(sp){ cls += sp.move>0?" sp-good":" sp-bad"; ic = sp.icon; }
    h += `<div class="${cls}" style="grid-column:${c};grid-row:${r}" title="${sp?esc(sp.label)+" ("+(sp.move>0?"+":"")+sp.move+")":""}">
      <div class="n">${i||""}</div><div class="ic">${ic}</div>${lab?`<div class="lab">${lab}</div>`:""}<div class="tokens" id="t${i}"></div></div>`;
  }
  h += `<div class="mid" id="mid"></div>`;
  $("#board").innerHTML = h;
}
function drawTokens(){
  for(let i=0;i<=FINISH;i++){ const el=document.getElementById("t"+i); if(el) el.innerHTML=""; }
  racers().forEach(([id,p])=>{
    const at = Math.min(FINISH, shown[id] ?? 0);
    const el = document.getElementById("t"+at);
    if(el) el.insertAdjacentHTML("beforeend", `<div class="tok${id===ME?" me":""}" style="background:${colorOf(id)}">${esc((p.name||"?")[0])}</div>`);
  });
}
function animateTo(target){
  let moving = false;
  for(const id in target){
    if(shown[id]===undefined){ shown[id]=target[id]; continue; }
    if(shown[id]!==target[id]){ moving = true; }
  }
  for(const id in shown) if(!(id in target)) delete shown[id];
  drawTokens();
  if(!moving || animTimer) return;
  animTimer = setInterval(()=>{
    let still = false;
    for(const id in target){
      const t = Math.min(target[id], FINISH);
      if(shown[id] < t){ shown[id]++; still = true; }
      else if(shown[id] > t){ shown[id]--; still = true; }
    }
    drawTokens();
    if(!still){ clearInterval(animTimer); animTimer=null; }
  }, 220);
}

/* ================= main render ================= */
function render(){
  const m = meta(), B = computeBoard(), joined = !!players()[ME], isJudge = ME===judgeId();
  $("#who").textContent = joined ? (isJudge ? "👑 "+nameOf(ME)+" (judge)" : nameOf(ME)) : "Not joined";
  $("#modeBanner").innerHTML = LOCAL ? `<div class="banner">Local test mode: open this page in more tabs to add fake players. Add ?host to the URL for host controls.</div>` : "";

  // center of board
  const R = ROUNDS[m.round];
  let mid = `<div class="logo">Madi's<small>29th</small></div>`;
  if(m.phase==="submit"||m.phase==="judge"||m.phase==="reveal"){
    mid = `<div class="rnd">Round ${m.round+1} of ${ROUNDS.length}</div><div class="prompt">${esc(R.prompt)}</div>`;
  } else if(m.phase==="final"){
    const champ = standings(B)[0];
    mid = `<div class="big">👑</div><div class="prompt">${champ?esc(nameOf(champ))+" wins!":"Game over"}</div>`;
  }
  $("#mid").innerHTML = mid;
  animateTo(B.pos);

  // legend
  $("#legend").innerHTML = racers().map(([id,p])=>{
    const a = answersFor(m.round)[id];
    const done = m.phase==="submit" && a;
    return `<div class="chip${done?" done":""}"><div class="tok" style="background:${colorOf(id)}">${esc(p.name[0])}</div>${esc(p.name)} · ${Math.min(B.pos[id]||0,FINISH)}${B.crossedAt[id]!==undefined?" 👑":""}${done?" ✓":""}</div>`;
  }).join("") + (judgeId()&&players()[judgeId()] ? `<div class="chip">👑 ${esc(nameOf(judgeId()))} judges</div>` : "");

  $("#main").innerHTML = joined ? phaseView(m, B, isJudge) : joinView();
  wire();
  renderHost(m, B);
}

function joinView(){
  return `<div class="card"><h2>Join the game</h2><p class="muted">No sign up. Just pick a name everyone will recognize.</p>
    <input id="nameIn" maxlength="16" placeholder="Your name" autocomplete="off">
    <button class="btn red" data-act="join">Join 🎉</button></div>`;
}

function answerCard(id, a, opts={}){
  const cls = ["ans"]; if(opts.pickable) cls.push("pickable"); if(opts.sel) cls.push("sel"); if(opts.win) cls.push("win");
  let body;
  if(a.type==="song"){
    body = `<div class="song">${a.art?`<img src="${esc(a.art)}" alt="">`:`<div style="width:56px;height:56px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;flex:none;background:#f3ecff">🎵</div>`}<div><div class="t">${esc(a.title)}</div><div class="a">${esc(a.artist||"")}</div>
      ${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener" class="a" style="color:var(--purple)">Open in Apple Music</a>`:""}</div>
      ${a.preview?`<button class="play" data-play="${esc(a.preview)}">▶</button>`:""}</div>`;
  } else body = `<div class="txt">${esc(a.text)}</div>`;
  return `<div class="${cls.join(" ")}" ${opts.pickable?`data-pick="${id}"`:""}>${opts.win?"<div style='font-size:22px'>👑</div>":""}${body}${opts.by?`<div class="by">${esc(opts.by)}</div>`:""}</div>`;
}
function shuffled(r){ return Object.entries(answersFor(r)).sort((a,b)=>hash(a[0]+r+GAME_ID)-hash(b[0]+r+GAME_ID)); }

function phaseView(m, B, isJudge){
  const R = ROUNDS[m.round], mine = answersFor(m.round)[ME];
  const nIn = Object.keys(answersFor(m.round)).length, nTotal = racers().length;
  if(m.phase==="lobby"){
    return `<div class="card center"><h2>You're in!</h2><p>${Object.keys(players()).length} player(s) here. Waiting for the host to start.</p>
      <p class="muted">${ROUNDS.length} rounds. Madi picks her favorite answer each round. Her pick moves <b>+${WIN_MOVE}</b>, everyone else who answers moves <b>+${PLAY_MOVE}</b>. First to cross the 👑 wins.</p></div>`;
  }
  if(m.phase==="submit"){
    if(isJudge) return `<div class="card center"><h2>Sit tight, birthday girl 👑</h2><p>Your friends are answering:</p><p class="display big">${nIn} / ${nTotal}</p></div>`;
    if(mine && !ui.editing) return `<div class="card center"><h2>Locked in ✓</h2>${answerCard(ME,mine)}<p class="muted">${nIn} of ${nTotal} answered. Answers stay anonymous.</p>
      <button class="btn ghost small" data-act="edit">Change my answer</button></div>`;
    if(R.type==="song") return songForm();
    return `<div class="card"><h2>${esc(R.prompt)}</h2><p class="muted">${R.oneWord?"One word only.":"Keep it short and sweet."} Madi won't see who wrote it.</p>
      <input id="txtIn" maxlength="${R.max||120}" placeholder="${R.oneWord?"One word":"Type your answer"}" autocomplete="off" value="${mine&&mine.text?esc(mine.text):""}">
      <button class="btn red" data-act="submitText">Submit</button></div>`;
  }
  if(m.phase==="judge"){
    const list = shuffled(m.round);
    if(isJudge) return `<div class="card"><h2>Pick your favorite 👑</h2><p class="muted">Tap one, then crown it. Your pick moves +${WIN_MOVE}.</p>
      ${list.map(([id,a])=>answerCard(id,a,{pickable:true,sel:ui.selected===id})).join("")}
      <button class="btn red" data-act="crown" ${ui.selected?"":"disabled"}>Crown it 👑</button></div>`;
    return `<div class="card"><h2>${esc(nameOf(judgeId()))} is choosing...</h2>${list.map(([id,a])=>answerCard(id,a,{})).join("")}</div>`;
  }
  if(m.phase==="reveal"){
    const pick = S.picks?.["r"+m.round], list = shuffled(m.round), ev = B.events[m.round]||[];
    const win = answersFor(m.round)[pick];
    return `<div class="card center"><h2>${esc(nameOf(pick))} takes it! +${WIN_MOVE}</h2>
      ${win?answerCard(pick,win,{win:true}):""}
      <p class="muted">Everyone else who answered moves +${PLAY_MOVE}.</p>
      ${ev.length?`<div class="events">${ev.map(e=>`${e.sp.icon} ${esc(nameOf(e.id))} hit <b>${esc(e.sp.label)}</b> (${e.sp.move>0?"+":""}${e.sp.move})`).join("<br>")}</div>`:""}
      ${Object.keys(B.crossedAt).length?`<p class="display" style="font-size:22px;margin-top:10px">👑 ${Object.keys(B.crossedAt).map(nameOf).map(esc).join(" & ")} crossed the crown!</p>`:""}
      </div>
      <div class="card"><h3>All answers</h3>${list.filter(([id])=>id!==pick).map(([id,a])=>answerCard(id,a,{by:m.revealAll?nameOf(id):""})).join("")||"<p class='muted'>Just the one!</p>"}</div>`;
  }
  if(m.phase==="final"){
    const st = standings(B), medal = ["🥇","🥈","🥉"];
    if(!ui.confettiDone){ ui.confettiDone = true; confetti(); }
    return `<div class="card center"><div class="big">👑</div><h2>${st[0]?esc(nameOf(st[0])):"Nobody"} is Madi's #1 fan!</h2>
      <p class="muted">Happy 29th, Madi! 🎂</p></div>
      <div class="card">${st.map((id,i)=>`<div class="chip" style="margin:6px 0;width:100%;padding:8px 12px;border-radius:12px;font-size:16px">
        ${medal[i]||(i+1)+"."} <div class="tok" style="background:${colorOf(id)}">${esc(nameOf(id)[0])}</div> ${esc(nameOf(id))}
        <span style="margin-left:auto">space ${Math.min(B.pos[id],FINISH)} · ${B.wins[id]} win${B.wins[id]===1?"":"s"}</span></div>`).join("")}</div>`;
  }
  return "";
}

function songForm(){
  let res = "";
  if(ui.searching) res = `<p class="muted center">Searching...</p>`;
  else if(ui.songResults){
    res = ui.songResults.length ? `<div class="results">${ui.songResults.map((s,i)=>`<div data-song="${i}">${answerCard("",s,{pickable:true})}</div>`).join("")}</div>`
      : `<p class="muted center">No results. Try different words, or add it manually below.</p>`;
  }
  return `<div class="card"><h2>${esc(ROUNDS[meta().round].prompt)}</h2><p class="muted">Search Apple Music and tap your pick.</p>
    <div style="display:flex;gap:8px"><input id="songQ" placeholder="Song or artist" autocomplete="off" value="${esc(ui.lastQ||"")}">
    <button class="btn small teal" style="margin:0" data-act="search">🔎</button></div>${res}
    ${ui.manualSong ? `<div style="margin-top:12px"><input id="mTitle" placeholder="Song title" style="margin-bottom:8px"><input id="mArtist" placeholder="Artist" style="margin-bottom:8px">
      <input id="mUrl" placeholder="Apple Music link (optional)"><button class="btn red" data-act="submitManual">Submit song</button></div>`
      : `<p class="center"><a href="#" data-act="manual" class="muted" style="color:var(--purple)">Can't find it? Add it manually</a></p>`}</div>`;
}

/* ================= actions ================= */
function jsonp(url, ms=6000){
  return new Promise((res,rej)=>{
    const cb = "cb"+Date.now()+Math.floor(Math.random()*1e6), s = document.createElement("script");
    const t = setTimeout(()=>{ cleanup(); rej(new Error("timeout")); }, ms);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); res(d); };
    s.onerror = () => { cleanup(); rej(new Error("load")); };
    s.src = url + (url.includes("?")?"&":"?") + "callback=" + cb;
    document.body.appendChild(s);
  });
}
const mapApple = x => ({ type:"song", title:x.trackName, artist:x.artistName,
  art:(x.artworkUrl100||"").replace("100x100","300x300"), preview:x.previewUrl||"", url:x.trackViewUrl||"" });
// iPhones sometimes block one method, so try several: Apple fetch, Apple JSONP, then Deezer as a backup catalog.
async function searchSongs(q){
  const term = encodeURIComponent(q);
  const apple = `https://itunes.apple.com/search?term=${term}&media=music&entity=song&limit=8&country=us`;
  try{
    const r = await fetch(apple, { mode:"cors" });
    if(r.ok){ const d = await r.json(); if(d.results && d.results.length) return d.results.map(mapApple); }
  }catch(e){}
  try{
    const d = await jsonp(apple);
    if(d.results && d.results.length) return d.results.map(mapApple);
  }catch(e){}
  const d = await jsonp(`https://api.deezer.com/search?q=${term}&limit=8&output=jsonp`);
  return (d.data||[]).map(x=>({ type:"song", title:x.title, artist:x.artist?.name||"",
    art:x.album?.cover_medium||"", preview:x.preview||"",
    url:`https://music.apple.com/us/search?term=${encodeURIComponent(x.title+" "+(x.artist?.name||""))}` }));
}
let audio = null;
function wire(){
  document.querySelectorAll("[data-act]").forEach(el=>el.onclick = e => { e.preventDefault(); act(el.dataset.act); });
  document.querySelectorAll("[data-pick]").forEach(el=>el.onclick = e => { if(e.target.closest("[data-play],a")) return; ui.selected = el.dataset.pick; render(); });
  document.querySelectorAll("[data-song]").forEach(el=>el.onclick = e => {
    if(e.target.closest("[data-play],a")) return;
    const s = ui.songResults[+el.dataset.song]; submit(s); ui.songResults=null; ui.lastQ="";
  });
  document.querySelectorAll("[data-play]").forEach(el=>el.onclick = e => {
    e.stopPropagation();
    const src = el.dataset.play;
    if(audio && audio.src===src && !audio.paused){ audio.pause(); el.textContent="▶"; return; }
    if(audio) audio.pause();
    document.querySelectorAll("[data-play]").forEach(b=>b.textContent="▶");
    audio = new Audio(src); audio.play().catch(()=>{}); el.textContent="❚❚"; audio.onended=()=>{el.textContent="▶"};
  });
  const enter = (id, a) => { const el=$(id); if(el) el.onkeydown = e => { if(e.key==="Enter") act(a); }; };
  enter("#nameIn","join"); enter("#txtIn","submitText"); enter("#songQ","search");
}
function submit(a){ ui.editing=false; ui.manualSong=false; store.set(`answers/r${meta().round}/${ME}`, a); }
async function act(a){
  const m = meta();
  if(a==="join"){
    const n = $("#nameIn").value.trim().slice(0,16); if(!n) return;
    store.set(`players/${ME}`, { name:n, joined:Date.now() });
  }
  if(a==="edit"){ ui.editing = true; render(); }
  if(a==="submitText"){
    let t = $("#txtIn").value.trim(); if(!t) return;
    if(ROUNDS[m.round].oneWord) t = t.split(/\s+/)[0];
    submit({ type:"text", text:t });
  }
  if(a==="search"){
    const q = $("#songQ").value.trim(); if(!q) return;
    ui.lastQ = q; ui.searching = true; render();
    try{
      ui.songResults = await searchSongs(q);
    }catch(e){ ui.songResults = []; ui.manualSong = true; }
    ui.searching = false; render();
  }
  if(a==="manual"){ ui.manualSong = true; render(); }
  if(a==="submitManual"){
    const t = $("#mTitle").value.trim(); if(!t) return;
    submit({ type:"song", title:t, artist:$("#mArtist").value.trim(), url:$("#mUrl").value.trim(), art:"", preview:"" });
  }
  if(a==="crown" && ui.selected){
    store.update({ [`picks/r${m.round}`]: ui.selected, "meta/phase":"reveal" }); ui.selected = null;
  }
  // host actions
  if(a==="start"){
    const j = $("#judgeSel").value; if(!j) return;
    store.update({ "meta/phase":"submit", "meta/round":0, "meta/judge":j, "meta/revealAll":false, answers:null, picks:null });
  }
  if(a==="lock"){ store.set("meta/phase","judge"); }
  if(a==="hostPick"){ /* judge fallback handled in judge view */ }
  if(a==="revealAll"){ store.set("meta/revealAll", !m.revealAll); }
  if(a==="next"){
    const B = computeBoard();
    if(Object.keys(B.crossedAt).length || m.round >= ROUNDS.length-1) store.set("meta/phase","final");
    else store.update({ "meta/round": m.round+1, "meta/phase":"submit", "meta/revealAll":false });
  }
  if(a==="end"){ store.set("meta/phase","final"); }
  if(a==="reset"){
    if(!ui.confirmReset){ ui.confirmReset = true; render(); setTimeout(()=>{ui.confirmReset=false;render();},3000); return; }
    ui.confirmReset = false; ui.confettiDone = false; shown = {};
    store.update({ meta:{ phase:"lobby", round:0 }, answers:null, picks:null });
  }
  if(a==="clearPlayers"){
    if(!ui.confirmClear){ ui.confirmClear = true; render(); setTimeout(()=>{ui.confirmClear=false;render();},3000); return; }
    ui.confirmClear = false; shown = {};
    store.update({ meta:{ phase:"lobby", round:0 }, answers:null, picks:null, players:null });
  }
}

/* ================= host bar ================= */
function renderHost(m, B){
  if(!IS_HOST){ $("#host").innerHTML=""; return; }
  const nIn = Object.keys(answersFor(m.round)).length;
  let row = "", lbl = "Host controls";
  if(m.phase==="lobby"){
    const ps = Object.entries(players());
    const def = (ps.find(([,p])=>/madi/i.test(p.name))||[])[0] || "";
    const cur = (ui.judgeChoice && players()[ui.judgeChoice]) ? ui.judgeChoice : def;
    lbl = `Lobby · ${ps.length} joined · choose the judge`;
    row = `<select id="judgeSel" style="flex:2;font-size:15px;padding:8px">${ps.length?"":"<option value=''>No players yet</option>"}${ps.map(([id,p])=>`<option value="${id}" ${id===cur?"selected":""}>👑 ${esc(p.name)}</option>`).join("")}</select>
      <button class="btn red" data-act="start" ${ps.length<2?"disabled":""}>Start game</button>`;
  } else if(m.phase==="submit"){
    lbl = `Round ${m.round+1} · ${nIn}/${racers().length} answered`;
    row = `<button class="btn red" data-act="lock" ${nIn?"":"disabled"}>Lock answers → Madi picks</button>`;
  } else if(m.phase==="judge"){
    lbl = `Round ${m.round+1} · waiting for ${esc(nameOf(judgeId()))} to pick`;
    row = `<button class="btn ghost" data-act="back">Reopen answers</button>`;
  } else if(m.phase==="reveal"){
    const last = Object.keys(B.crossedAt).length || m.round>=ROUNDS.length-1;
    lbl = `Round ${m.round+1} results`;
    row = `<button class="btn ghost" data-act="revealAll">${m.revealAll?"Hide":"Show"} who wrote what</button>
      <button class="btn red" data-act="next">${last?"Final results 👑":"Next round →"}</button>`;
  } else if(m.phase==="final"){
    lbl = "Game over";
  }
  row += `<button class="btn ghost" data-act="reset" style="flex:0 0 auto">${ui.confirmReset?"Tap again":"Restart"}</button>`;
  if(m.phase==="lobby") row += `<button class="btn ghost" data-act="clearPlayers" style="flex:0 0 auto">${ui.confirmClear?"Tap again":"Clear players"}</button>`;
  $("#host").innerHTML = `<div class="hostbar"><div class="inner"><div class="lbl">${lbl}</div><div class="row">${row}</div></div></div>`;
  document.querySelectorAll("#host [data-act]").forEach(el=>el.onclick = e => { e.preventDefault(); el.dataset.act==="back" ? store.set("meta/phase","submit") : act(el.dataset.act); });
  const sel = $("#judgeSel"); if(sel) sel.onchange = () => { ui.judgeChoice = sel.value; };
  const bar = document.querySelector(".hostbar");
  if(bar) document.body.style.paddingBottom = (bar.offsetHeight + 30) + "px";
}

function confetti(){
  const box = $("#confetti"), cols = ["#ef4f4f","#ffc83d","#1fb5a8","#8a5cf6","#ff7ab6","#3d8bff"];
  for(let i=0;i<120;i++){
    const el = document.createElement("i");
    el.style.left = Math.random()*100+"vw"; el.style.background = cols[i%cols.length];
    el.style.animationDuration = (2.5+Math.random()*2.5)+"s"; el.style.animationDelay = (Math.random()*1.5)+"s";
    box.appendChild(el);
  }
  setTimeout(()=>box.innerHTML="", 7000);
}

/* ================= boot ================= */
let lastPhaseKey = "";
function onState(s){
  S = s || {};
  const k = meta().phase + meta().round;
  if(k!==lastPhaseKey){ ui.selected=null; ui.editing=false; ui.songResults=null; ui.manualSong=false; if(meta().phase!=="final") ui.confettiDone=false; lastPhaseKey=k; }
  // don't wipe what someone is typing
  const active = document.activeElement;
  const typing = active && active.tagName==="INPUT" && active.id;
  const keep = typing ? { id:active.id, v:active.value, s:active.selectionStart } : null;
  const keepVals = {}; ["mTitle","mArtist","mUrl","songQ"].forEach(id=>{ const el=document.getElementById(id); if(el) keepVals[id]=el.value; });
  render();
  for(const id in keepVals){ const el=document.getElementById(id); if(el && !el.value) el.value = keepVals[id]; }
  if(keep){ const el=document.getElementById(keep.id); if(el){ el.value=keep.v; el.focus(); try{el.setSelectionRange(keep.s,keep.s)}catch(e){} } }
}
buildBoard();
(async()=>{
  if(LOCAL){ store = makeLocalStore(onState); }
  else{
    await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js");
    await loadScript("https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js");
    store = makeFirebaseStore(onState);
  }
})();
</script>
